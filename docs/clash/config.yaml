# PrismPreview grouped Mihomo matrix.
#
# This file is derived from the old docs/clash/config.yaml catalog, but keeps
# only combinations with a real PrismPreview binding and a documented Mihomo
# wire path. The endpoint and credentials match PrismPreviewClient.yaml.
#
# AnyTLS keeps its own application multiplexing and is deliberately absent
# from Prism-Mux. Hysteria2 is QUIC/UDP, not TCP. TUIC, generic SS2022 mux,
# carrier-mux variants without a unique route, and invalid plugin combinations
# are intentionally omitted.

mixed-port: 7890
socks-port: 7891
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
external-controller: 192.168.0.106:19091

dns:
  enable: true
  use-hosts: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

hosts:
  socks5.preview: 192.168.0.106

proxies:
  # HTTP
  - name: "Http"
    type: http
    server: 192.168.0.106
    port: 18080
    username: local
    password: "PrismPreview-106-20260914"

  - name: "HTTP Native TLS"
    type: http
    server: 192.168.0.106
    port: 18080
    username: local
    password: "PrismPreview-106-20260914"
    tls: true
    skip-cert-verify: true
    sni: "http.preview"

  # SOCKS5
  - name: "SOCKS5 TCP Cert"
    type: socks5
    server: 192.168.0.106
    port: 18080
    username: local
    password: "PrismPreview-106-20260914"
    udp: false

  - name: "SOCKS5 Native TLS TCP"
    type: socks5
    server: socks5.preview
    port: 18080
    username: local
    password: "PrismPreview-106-20260914"
    tls: true
    skip-cert-verify: true
    servername: "socks5.preview"

  - name: "SOCKS5 UDP Cert"
    type: socks5
    server: 192.168.0.106
    port: 18080
    username: local
    password: "PrismPreview-106-20260914"
    udp: true

  # Trojan
  - name: "Trojan Native TLS TCP"
    type: trojan
    server: 192.168.0.106
    port: 18080
    password: "PrismPreview-106-20260914"
    tls: true
    skip-cert-verify: true
    sni: "trojan.preview"

  - name: "Trojan Smux TCP"
    type: trojan
    server: 192.168.0.106
    port: 18080
    password: "PrismPreview-106-20260914"
    tls: true
    skip-cert-verify: true
    sni: "trojan-smux.preview"
    smux:
      enabled: true
      protocol: smux
      only-tcp: true

  - name: "Trojan Reality TCP"
    type: trojan
    server: 192.168.0.106
    port: 18080
    password: "PrismPreview-106-20260914"
    tls: true
    skip-cert-verify: true
    sni: trojan.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: "GNzW_6UxNDlSnpWilzHxDShcmP56wgYsqKcp-tSKgAk"
      short-id: "45587ac66ce007e4"

  # VMess
  - name: "VMess TCP"
    type: vmess
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    alterId: 0
    cipher: auto
    network: tcp
    tls: false
    udp: false

  - name: "VMess Native TLS TCP"
    type: vmess
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    alterId: 0
    cipher: auto
    network: tcp
    tls: true
    skip-cert-verify: true
    servername: "vmess.preview"

  - name: "VMess Yamux TCP"
    type: vmess
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    alterId: 0
    cipher: auto
    network: tcp
    tls: true
    skip-cert-verify: true
    servername: "vmess-yamux.preview"
    smux:
      enabled: true
      protocol: yamux
      only-tcp: true

  - name: "VMess UDP"
    type: vmess
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    alterId: 0
    cipher: auto
    network: tcp
    tls: false
    udp: true

  - name: "VMess Reality TCP"
    type: vmess
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    alterId: 0
    cipher: auto
    network: tcp
    tls: true
    skip-cert-verify: true
    servername: "vmess.microsoft.com"
    client-fingerprint: chrome
    reality-opts:
      public-key: "GNzW_6UxNDlSnpWilzHxDShcmP56wgYsqKcp-tSKgAk"
      short-id: "45587ac66ce007e4"

  # Shadowsocks 2022
  - name: "SS2022 TCP"
    type: ss
    server: 192.168.0.106
    port: 18080
    cipher: 2022-blake3-aes-128-gcm
    password: "5n5ESu953i/pjIp02oZvHA=="
    udp: false

  - name: "SS2022 UDP"
    type: ss
    server: 192.168.0.106
    port: 18080
    cipher: 2022-blake3-aes-128-gcm
    password: "5n5ESu953i/pjIp02oZvHA=="
    udp: true

  - name: "SS2022 ShadowTLS TCP"
    type: ss
    server: 192.168.0.106
    port: 18080
    cipher: 2022-blake3-aes-128-gcm
    password: "5n5ESu953i/pjIp02oZvHA=="
    plugin: shadow-tls
    plugin-opts:
      host: "www.apple.com"
      password: "shadowtls_password"
      version: 3
      skip-cert-verify: true

  - name: "SS2022 Restls TLS13 TCP"
    type: ss
    server: 192.168.0.106
    port: 18080
    cipher: 2022-blake3-aes-128-gcm
    password: "5n5ESu953i/pjIp02oZvHA=="
    plugin: restls
    plugin-opts:
      host: "www.nvidia.com"
      password: "restls_password"
      version-hint: "tls13"
      skip-cert-verify: true

  # VLESS
  - name: "VLESS TCP"
    type: vless
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    network: tcp
    tls: false
    udp: false

  - name: "VLESS Native TLS TCP"
    type: vless
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    network: tcp
    tls: true
    udp: false
    skip-cert-verify: true
    servername: "www.bing.com"

  - name: "VLESS Smux TCP"
    type: vless
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    network: tcp
    tls: true
    udp: false
    skip-cert-verify: true
    servername: "vless-smux.preview"
    smux:
      enabled: true
      protocol: smux
      only-tcp: true

  - name: "VLESS Yamux TCP"
    type: vless
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    network: tcp
    tls: true
    udp: false
    skip-cert-verify: true
    servername: "vless-yamux.preview"
    smux:
      enabled: true
      protocol: yamux
      only-tcp: true

  - name: "VLESS H2Mux TCP"
    type: vless
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    network: tcp
    tls: true
    udp: false
    skip-cert-verify: true
    servername: "vless-h2mux.preview"
    smux:
      enabled: true
      protocol: h2mux
      only-tcp: true

  - name: "VLESS UDP"
    type: vless
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    network: tcp
    tls: false
    udp: true

  - name: "VLESS Reality TCP"
    type: vless
    server: 192.168.0.106
    port: 18080
    uuid: "123e4567-e89b-12d3-a456-426614174000"
    network: tcp
    tls: true
    udp: false
    skip-cert-verify: true
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: "GNzW_6UxNDlSnpWilzHxDShcmP56wgYsqKcp-tSKgAk"
      short-id: "45587ac66ce007e4"

  # AnyTLS owns application-layer multiplexing. Do not add smux/yamux here.
  - name: "AnyTLS TCP"
    type: anytls
    server: 192.168.0.106
    port: 18080
    password: "anytls_password"
    sni: "www.cloudflare.com"
    skip-cert-verify: true
    udp: false

  # Hysteria2 owns QUIC stream/datagram semantics.
  - name: "Hysteria2 QUIC"
    type: hysteria2
    server: 192.168.0.106
    port: 18080
    udp: true
    password: "hysteria2_password"
    sni: "hysteria2-gateway-e2e"
    skip-cert-verify: true

proxy-groups:
  - name: "Prism-Active"
    type: select
    proxies:
      - "Http"
      - "SOCKS5 TCP Cert"
      - "VLESS TCP"
      - "Trojan Native TLS TCP"
      - "VMess TCP"
      - "SS2022 TCP"
      - DIRECT

  - name: "Prism-TCP"
    type: select
    proxies:
      - "Http"
      - "HTTP Native TLS"
      - "SOCKS5 TCP Cert"
      - "SOCKS5 Native TLS TCP"
      - "Trojan Native TLS TCP"
      - "Trojan Smux TCP"
      - "Trojan Reality TCP"
      - "VMess TCP"
      - "VMess Native TLS TCP"
      - "VMess Yamux TCP"
      - "VMess Reality TCP"
      - "SS2022 TCP"
      - "SS2022 ShadowTLS TCP"
      - "SS2022 Restls TLS13 TCP"
      - "VLESS TCP"
      - "VLESS Native TLS TCP"
      - "VLESS Smux TCP"
      - "VLESS Yamux TCP"
      - "VLESS H2Mux TCP"
      - "VLESS Reality TCP"
      - "AnyTLS TCP"

  - name: "Prism-UDP"
    type: select
    proxies:
      - "SOCKS5 UDP Cert"
      - "VLESS UDP"
      - "VMess UDP"
      - "SS2022 UDP"
      - "Hysteria2 QUIC"

  - name: "Prism-HTTP"
    type: select
    proxies:
      - "Http"
      - "HTTP Native TLS"

  - name: "Prism-SOCKS5"
    type: select
    proxies:
      - "SOCKS5 TCP Cert"
      - "SOCKS5 Native TLS TCP"
      - "SOCKS5 UDP Cert"

  - name: "Prism-Trojan"
    type: select
    proxies:
      - "Trojan Native TLS TCP"
      - "Trojan Smux TCP"
      - "Trojan Reality TCP"

  - name: "Prism-VMess"
    type: select
    proxies:
      - "VMess TCP"
      - "VMess Native TLS TCP"
      - "VMess Yamux TCP"
      - "VMess UDP"
      - "VMess Reality TCP"

  - name: "Prism-VLESS"
    type: select
    proxies:
      - "VLESS TCP"
      - "VLESS Native TLS TCP"
      - "VLESS Smux TCP"
      - "VLESS Yamux TCP"
      - "VLESS H2Mux TCP"
      - "VLESS UDP"
      - "VLESS Reality TCP"

  - name: "Prism-SS2022"
    type: select
    proxies:
      - "SS2022 TCP"
      - "SS2022 UDP"
      - "SS2022 ShadowTLS TCP"
      - "SS2022 Restls TLS13 TCP"

  - name: "Prism-AnyTLS"
    type: select
    proxies:
      - "AnyTLS TCP"

  - name: "Prism-Hysteria2"
    type: select
    proxies:
      - "Hysteria2 QUIC"

  # Generic mux only. AnyTLS is intentionally excluded because it owns mux.
  - name: "Prism-Mux"
    type: select
    proxies:
      - "VLESS Smux TCP"
      - "VLESS Yamux TCP"
      - "VLESS H2Mux TCP"
      - "VMess Yamux TCP"
      - "Trojan Smux TCP"

  # Modified/custom protocol and carrier group.
  - name: "Prism-魔改协议"
    type: select
    proxies:
      - "VLESS Reality TCP"
      - "VMess Reality TCP"
      - "Trojan Reality TCP"
      - "SS2022 ShadowTLS TCP"
      - "SS2022 Restls TLS13 TCP"
      - "AnyTLS TCP"
      - "Hysteria2 QUIC"

  - name: "Prism-ProtocolMatrix"
    type: select
    proxies:
      - "Http"
      - "HTTP Native TLS"
      - "SOCKS5 TCP Cert"
      - "SOCKS5 Native TLS TCP"
      - "SOCKS5 UDP Cert"
      - "Trojan Native TLS TCP"
      - "Trojan Smux TCP"
      - "Trojan Reality TCP"
      - "VMess TCP"
      - "VMess Native TLS TCP"
      - "VMess Yamux TCP"
      - "VMess UDP"
      - "VMess Reality TCP"
      - "SS2022 TCP"
      - "SS2022 UDP"
      - "SS2022 ShadowTLS TCP"
      - "SS2022 Restls TLS13 TCP"
      - "VLESS TCP"
      - "VLESS Native TLS TCP"
      - "VLESS Smux TCP"
      - "VLESS Yamux TCP"
      - "VLESS H2Mux TCP"
      - "VLESS UDP"
      - "VLESS Reality TCP"
      - "AnyTLS TCP"
      - "Hysteria2 QUIC"

rules:
  - IP-CIDR6,::/0,REJECT
  - IP-CIDR,192.168.0.0/16,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT
  - IP-CIDR,172.16.0.0/12,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT
  - MATCH,Prism-Active
