# PrismPreview LAN configuration status matrix.
# This manifest is the static status companion to PrismPreviewClient.yaml.
# The exhaustive node set is copied from docs/clash/config.yaml; it is not a
# claim that every node is currently enabled by the Preview server.

schema-version: 1

baseline:
  file: docs/clash/config.yaml
  proxy-node-count: 74
  policy-groups:
    - PrismPreview-Active
    - PrismPreview-ProtocolMatrix
    - PrismPreview-Xiaomi-Health

server:
  address: 192.168.0.106
  port: 18080
  credentials:
    username: local
    password: "PrismPreview-106-20260914"
  listeners:
    tcp: active
    udp: "server-side pending"
    quic: "server-side pending"
  capability-contract:
    transport: tcp
    tls: "protocol-native for Trojan; false for other active entries"
    native-tls: true
    udp: false
    quic: false
    carriers: []
  active-protocols:
    - http
    - socks5
    - vless
    - trojan
    - vmess
    - ss2022
  pending-protocols:
    - anytls
    - hysteria2
    - tuic
  pending-variants:
    - http-tls
    - socks5-udp
    - trojan-udp
    - vless-tls
    - vless-udp
    - vmess-udp
    - shadowsocks2022-carrier
    - mux
  pending-carriers:
    - shadowtls
    - restls
    - reality
    - anytls
    - quic
  pending-mux-variants:
    - smux
    - yamux

client:
  file: PrismPreviewClient.yaml
  log-level: info
  external-controller: 192.168.0.106:19091
  active-group: PrismPreview-Active
  protocol-matrix-group: PrismPreview-ProtocolMatrix
  health-group: PrismPreview-Xiaomi-Health
  health:
    url: "http://connect.rom.miui.com/generate_204"
    interval-seconds: 300
    probes:
      - "SOCKS5 TCP Cert"

status-contract:
  active:
    - "Http"
    - "SOCKS5 TCP Cert"
    - "VLESS TCP"
    - "Trojan TCP"
    - "VMess TCP"
    - "SS2022 TCP"
  pending-rule: >-
    The six active entries use TCP. Trojan uses its protocol-native TLS
    admission with the Preview NativeTls context; the other five active
    entries use bare TCP with tls false and udp false. Every other matrix
    entry is server-side pending.
    The client retains the complete protocol, carrier, SNI, UDP, QUIC, and mux
    matrix for manual staged testing, but pending entries are excluded from
    the active/default and health groups.

