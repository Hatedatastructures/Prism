# PrismPreview LAN configuration status matrix.
# This manifest is the static status companion to PrismPreviewClient.yaml.
# This manifest contains only the operational PrismPreview client matrix.

schema-version: 1

baseline:
  file: PrismPreviewClient.yaml
    proxy-node-count: 26
  policy-groups:
    - PrismPreview-Active
    - PrismPreview-Verified
    - PrismPreview-ProtocolMatrix

server:
  address: 192.168.0.106
  port: 18080
  credentials:
    username: local
    password: "PrismPreview-106-20260914"
  listeners:
    tcp: active
    udp: active
    quic: active
  capability-contract:
    transport: "tcp plus shared udp/quic listener"
    tls: "per-node; native TLS, Reality, ShadowTLS and Restls are explicit carriers"
    native-tls: true
    udp: true
    quic: true
    carriers:
      - native
      - reality
      - shadowtls
      - restls
      - quic
  active-protocols:
    - http
    - socks5
    - vless
    - trojan
    - vmess
    - ss2022
  pending-protocols: []
  pending-variants: []
  pending-carriers: []
  pending-mux-variants: []

client:
  file: PrismPreviewClient.yaml
  log-level: info
  external-controller: 192.168.0.106:19091
  active-group: PrismPreview-Active
  protocol-matrix-group: PrismPreview-ProtocolMatrix

status-contract:
  active:
    - "Http"
    - "SOCKS5 TCP Cert"
    - "VLESS TCP"
    - "VMess TCP"
    - "SS2022 TCP"
    - "Trojan Native TLS TCP"
  verified-manual:
    - "HTTP Native TLS"
    - "SOCKS5 Native TLS TCP"
    - "SOCKS5 UDP Cert"
    - "Trojan Reality TCP"
    - "VLESS Native TLS TCP"
    - "VLESS Smux TCP"
    - "VLESS UDP"
    - "VLESS Yamux TCP"
    - "VLESS H2Mux TCP"
    - "VLESS Reality TCP"
    - "SS2022 ShadowTLS TCP"
    - "SS2022 Restls TLS13 TCP"
    - "SS2022 UDP"
    - "AnyTLS TCP"
    - "VMess Native TLS TCP"
    - "VMess Yamux TCP"
    - "VMess UDP"
    - "VMess Reality TCP"
    - "Hysteria2 QUIC"

entries:
  pending-rule: >-
    The six active entries use TCP. Trojan uses its protocol-native TLS
    admission with the Preview NativeTls context; the other five active
    entries use bare TCP with tls false and udp false. verified-manual entries
    have a repeatable real-client payload result and are available only in the
    verified/manual matrix group. Remaining pending entries are excluded from
    the active/default, health, and verified matrix groups.

  - name: "SOCKS5 TCP Cert"
    status: active
    protocol: socks5
    carrier: native
    transport: tcp
    tls: false
    udp: false
  - name: "SOCKS5 Native TLS TCP"
    status: verified-manual
    protocol: socks5
    carrier: native
    sni: socks5.preview
  - name: "SOCKS5 UDP Cert"
