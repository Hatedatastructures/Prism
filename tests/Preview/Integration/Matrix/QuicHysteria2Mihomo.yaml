mixed-port: 18081
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: debug
proxies:
  - name: prism-hysteria2
    type: hysteria2
    server: 192.168.0.106
    port: 18080
    password: hysteria2_password
    sni: hysteria2-gateway-e2e
    skip-cert-verify: true
    udp: true
proxy-groups:
  - name: proxy
    type: select
    proxies:
      - prism-hysteria2
rules:
  - MATCH,proxy
