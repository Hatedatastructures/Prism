# PrismPreview exhaustive Mihomo/Clash test matrix.
# Server target: 192.168.0.106:18080
# Current running server capability: six TCP protocol bindings are declared active:
# HTTP, SOCKS5, VLESS, Trojan, VMess and Shadowsocks2022.
# Status contract: the six base TCP nodes are active; additional TLS carrier variants,
# mux variants and UDP/QUIC nodes remain pending exact-process verification.
# The full protocol matrix is kept for staged protocol testing after the
# matching server-side protocol/carrier is enabled. The default rule uses the
# active TCP group so unsupported carrier/UDP/QUIC entries are never probed automatically.
# Health checks use Xiaomi's low-cost endpoint only when the health group is
# explicitly selected by the client.

# 全局端口设置
mixed-port: 7890
socks-port: 7891
allow-lan: true                # 允许局域网连接（手机可通过局域网IP连接）
bind-address: '*'              # 监听所有网卡
mode: rule
log-level: info
external-controller: 192.168.0.106:19091
global-client-fingerprint: none  # 禁用全局 uTLS 指纹模拟，ShadowTLS 需要标准 TLS

# DNS 设置
# 测试：当前开发环境没有ipv6，只能使用v4
dns:
  enable: true                  # 启用 Clash 内置 DNS
  ipv6: false                   # 禁止查询 AAAA 记录，只返回 IPv4 地址，避免客户端把 IPv6 地址发给代理导致连接失败
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # fallback:
  #   - https://1.1.1.1/dns-query
  #   - https://dns.google/dns-query
  # fallback-filter:
  #   geoip: true  # 现在禁用掉，避免误伤国内IP导致无法访问国内站点
  #   geoip-code: CN

# ---------- pending carrier notes ----------
# The SNI mappings below describe staged carrier variants only:
#   - www.microsoft.com   -> Reality
#   - www.apple.com       -> ShadowTLS
#   - www.nvidia.com      -> Restls
#   - www.cloudflare.com  -> AnyTLS
#   - www.amazon.com      -> TrustTunnel
# They remain outside the active and health groups until the server exposes
# the matching TLS carrier and each exact client combination is verified.
# Hysteria2 and TUIC remain pending because the current server has no UDP/QUIC
# listener. VMess and SS2022 use the active bare TCP probe path.

