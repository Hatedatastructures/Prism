mixed-port: 18081
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: debug
proxies:
  - name: prism-hysteria2
    type: hysteria2
    server: 127.0.0.1
    port: 18080
    password: hysteria2_password
    sni: hysteria2-gateway-e2e
    skip-cert-verify: true
    alpn:
      - h3
    udp: true
proxy-groups:
  - name: Hysteria2 QUIC
    type: select
    proxies:
      - prism-hysteria2
rules:
  - MATCH,PrismPreview-Active
