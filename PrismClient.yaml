# PrismPreview verified Mihomo/Clash runtime matrix.
# Server target: 127.0.0.1:18080
# Active nodes are real TCP paths; Verified nodes have exact client/server payload evidence.
# AnyTLS uses its own application mux. Generic mux is advertised only for
# VLESS Smux/Yamux/H2Mux, VMess Yamux and Trojan Smux.
# Mihomo max-connections and max-streams are mutually exclusive. Mux profile
# nodes use exactly one limit axis and never the invalid max-conn spelling.
# Unverified UDP, carrier-mux, WebSocket/XHTTP/Gun, TrustTunnel and protocol-mismatched nodes are removed.
# No URL-test health group is configured; isolated validation owns health and payload checks.

# 全局端口设置
mixed-port: 0
socks-port: 0
allow-lan: false               # 隔离测试仅允许本机回环
bind-address: 127.0.0.1         # 隔离测试仅监听回环
mode: rule
log-level: info
external-controller: 127.0.0.1:19091

# DNS 设置
# 测试：当前开发环境没有ipv6，只能使用v4
dns:
  enable: true                  # 启用 Clash 内置 DNS
  use-hosts: true               # 允许协议测试节点使用受控本地 SNI 别名
  ipv6: false                   # 禁止查询 AAAA 记录，只返回 IPv4 地址，避免客户端把 IPv6 地址发给代理导致连接失败
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # fallback:
  #   - https://1.1.1.1/dns-query
  #   - https://dns.google/dns-query
  # fallback-filter:
  #   geoip: true  # 现在禁用掉，避免误伤国内IP导致无法访问国内站点
  #   geoip-code: CN

# SOCKS5 outbound 的 TLS ServerName 由 Mihomo 的 server 字段决定；
# 该别名只用于本地协议测试，hosts 解析仍指向本机受控 listener。
hosts:
  socks5.preview: 127.0.0.1

# ---------- carrier routing notes ----------
# The SNI mappings below describe staged carrier variants only:
#   - www.microsoft.com   -> Reality
#   - www.apple.com       -> ShadowTLS
#   - www.nvidia.com      -> Restls
#   - www.cloudflare.com  -> AnyTLS
# Verified carrier and UDP nodes remain outside the active and health groups to
# avoid startup-probe cross-traffic. WebSocket/XHTTP/Gun, TrustTunnel, Trojan
# UDP, AnyTLS UDP, carrier UDP, and carrier-mux variants are excluded because
# the current JSON bindings do not expose those wire paths. Hysteria2 and TUIC
# use the independent QUIC gateway and remain pending until their external
# client matrix runs are promoted.
# SS2022 uses raw SS2022 TCP/UDP or Mihomo's shadow-tls/restls plugins.
# Mihomo has no native SS outbound TLS field, and the server has no
# SS2022-plus-NativeTls binding, so that made-up combination is omitted.

# ---------- 协议测试节点 ----------
proxies:
  - name: "SOCKS5 TCP Cert" # status: active
    type: socks5
    server: 127.0.0.1
    port: 18080
    username: "local"
    password: "PrismPreview-106-20260914"
    udp: false


  - name: "SOCKS5 UDP Cert" # status: verified-manual
    type: socks5
    server: 127.0.0.1
    port: 18080
    username: "local"
    password: "PrismPreview-106-20260914"
    udp: true


  - name: "SOCKS5 Native TLS TCP" # status: verified-manual
    type: socks5
    server: socks5.preview
    port: 18080
    username: "local"
    password: "PrismPreview-106-20260914"
