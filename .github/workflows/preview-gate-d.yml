name: Preview Gate D Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: prism-preview-gate-d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Preview evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup PowerShell
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: tests/go/go.sum

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get install -y build-essential g++-13 nasm

      - name: Configure
        shell: pwsh
        run: |
          if ('${{ runner.os }}' -eq 'Windows') {
            cmake -B build -G 'MinGW Makefiles' -DCMAKE_BUILD_TYPE=Release -DPRISM_ENABLE_INTEROP=ON -DPRISM_ENABLE_PERF_CONTRACT=ON -DPRISM_ENABLE_BENCHMARK=ON -DPRISM_ENABLE_STRESS=ON
          } else {
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13 -DPRISM_ENABLE_INTEROP=ON -DPRISM_ENABLE_PERF_CONTRACT=ON -DPRISM_ENABLE_BENCHMARK=ON -DPRISM_ENABLE_STRESS=ON
          }

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Run Tests
        shell: pwsh
        run: ctest --test-dir build --no-tests=error --output-on-failure --timeout 60 -j 1 -LE 'perf|stress|interop'

      - name: Run Performance Contract
        shell: pwsh
        run: |
          $env:PRISM_PERF_OUTPUT = Join-Path $pwd 'build/perf-contract-results.json'
          ctest --test-dir build --no-tests=error --output-on-failure --timeout 120 -j 1 -R '^PerformanceContract\.'

      - name: Run Preview Recognition Performance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/preview-evidence | Out-Null
          & ctest --test-dir build -L perf -R '^Perf_Recognition$' --no-tests=error --output-on-failure --timeout 1800 -j 1 -V *>&1 | Tee-Object -FilePath build/preview-evidence/recognition-perf.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Preview Recognition Stability
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/preview-evidence | Out-Null
          & ctest --test-dir build --no-tests=error --output-on-failure --timeout 120 -j 1 -V -R '^RecognitionStability\.' *>&1 | Tee-Object -FilePath build/preview-evidence/recognition-stability.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Go reference tools
        shell: pwsh
        working-directory: tests/go
        run: |
          New-Item -ItemType Directory -Force -Path ../../build/tests/go | Out-Null
          $Tools = @('anytlscmp', 'guncmp', 'realitycmp', 'restlscmp', 'shadowtlscmp', 'trusttunnelcmp', 'wscmp', 'httpcmp', 'socks5cmp', 'trojancmp', 'vlesscmp', 'hysteria2cmp', 'tuiccmp', 'xhttpcmp', 'vmesscmp')
          foreach ($Tool in $Tools) {
            go build -o ("../../build/tests/go/{0}.exe" -f $Tool) ("./{0}" -f $Tool)
          }
          go build -o ../../build/tests/go/ss2022_client.exe ./interop/ss2022_client
          go build -o ../../build/tests/go/ss2022_server.exe ./interop/ss2022_server
          go build -o ../../build/tests/go/websocket.exe ./websocket
          go build -o ../../build/tests/go/anytls.exe ./anytls
          go build -o ../../build/tests/go/gun.exe ./gun
          go build -o ../../build/tests/go/xhttp.exe ./xhttp
          go build -o ../../build/tests/go/trusttunnel.exe ./trusttunnel

      - name: Select Prism executable
        id: prism
        shell: pwsh
        run: |
          if ('${{ runner.os }}' -eq 'Windows') {
            $Path = 'build/src/Prism.exe'
          } else {
            $Path = 'build/src/Prism'
          }
          "path=$Path" >> $env:GITHUB_OUTPUT

      - name: Run PrismPreview evidence runner when supplied
        shell: pwsh
        env:
          PRISM_PREVIEW_EXE: ${{ vars.PRISM_PREVIEW_EXE }}
          PRISM_PREVIEW_CONFIG: ${{ vars.PRISM_PREVIEW_CONFIG }}
        run: |
          New-Item -ItemType Directory -Force -Path build/preview-runner | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:PRISM_PREVIEW_EXE) -or
              [string]::IsNullOrWhiteSpace($env:PRISM_PREVIEW_CONFIG)) {
            [ordered]@{
              schema = 'prism.preview-runner.v1'
              status = 'environment-unavailable'
              reason = 'PRISM_PREVIEW_EXE and PRISM_PREVIEW_CONFIG were not supplied'
              mode = 'preview-only'
            } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath build/preview-runner/summary.json -Encoding UTF8
            Write-Host 'PrismPreview evidence blocked: executable/config variables were not supplied.'
          } else {
            pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/interop/Run-PrismPreview.ps1 `
              -PrismPreviewExe $env:PRISM_PREVIEW_EXE `
              -Config $env:PRISM_PREVIEW_CONFIG `
              -OutputDirectory build/preview-runner
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Interop Classifier Tests
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/interop/InteropRunner.Tests.ps1

      - name: Run External Interop Matrix
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/interop/Run-Matrix.ps1 -RepoRoot $pwd -OutputDirectory build/interop-results -Platform '${{ runner.os }}-${{ runner.arch }}' -PrismExe '${{ steps.prism.outputs.path }}' -AllowBlocked

      - name: Fail on protocol or implementation mismatch
        shell: pwsh
        run: |
          $Summary = Get-Content -Raw build/interop-results/summary.json | ConvertFrom-Json
          Write-Host ("Interop evidence: scope={0}, production_prerequisite_included={1}, total={2}, pass={3}, blocked={4}, production_blocked={5}, preview_only_blocked={6}, failed={7}" -f $Summary.scope, $Summary.production_prerequisite_included, $Summary.total, $Summary.pass, $Summary.blocked, $Summary.production_blocked, $Summary.preview_only_blocked, $Summary.failed)
          if ($Summary.scope -ne 'full' -or -not $Summary.production_prerequisite_included) {
            Write-Error 'Preview Gate D requires full interop scope with production prerequisite records'
            exit 1
          }
          if ($Summary.failed -gt 0 -or ($Summary.scope -eq 'full' -and $Summary.production_blocked -gt 0)) { exit 1 }

      - name: Upload Evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: preview-gate-d-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            build/interop-results/**
            build/**/preview-production-perf.json
            build/**/perf-contract*.json
            build/preview-evidence/**
